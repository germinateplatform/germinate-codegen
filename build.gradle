import groovy.xml.XmlSlurper

buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
}

compileJava.options.encoding = 'UTF-8'

group = 'uk.ac.hutton.germinate'
version = '5.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation 'org.json:json:20250517'
    implementation 'com.google.code.gson:gson:2.10'

    implementation 'com.mysql:mysql-connector-j:8.2.0'
    implementation 'org.jooq:jooq:3.20.5'
    implementation 'org.jooq:jooq-codegen:3.20.5'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'javax.activation:activation:1.1.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.2'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'

    implementation 'com.smattme:mysql-backup4j:1.3.0'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

// Runs the JOOQ code generation
task codegen (type: JavaExec) {
    group = 'Execution'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.jooq.codegen.GenerationTool'
    args 'jooq.xml'
    finalizedBy build
}

task dbDump(type: JavaExec) {
    group = 'Execution'
    description = 'Dumps the database using mysql-backup4j, based on connection info from jooq.xml'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'jhi.germinate.server.database.DbDump'

    doFirst {
        def jooqXmlFile = sourceSets.main.resources.matching { include 'jooq.xml' }.singleFile
        def jooqConfig = new XmlSlurper().parse(jooqXmlFile)
        def jdbc = jooqConfig.jdbc

        String url = jdbc.url.text()
        String user = jdbc.user.text()
        String password = jdbc.password.text()

        jdbc.properties.property.each { prop ->
            if (prop.key.text() == 'user' && !user) user = prop.value.text()
            if (prop.key.text() == 'password' && !password) password = prop.value.text()
        }

        def matcher = (url =~ /jdbc:mysql:\/\/([^:\/]+)(?::(\d+))?\/([^?]+)/)
        if (!matcher.find()) {
            throw new GradleException("Could not parse JDBC url: ${url}")
        }
        String host = matcher.group(1)
        String port = matcher.group(2) ?: '3306'
        String database = matcher.group(3)

        if (!project.hasProperty('germinate.source.directory')) {
            throw new GradleException("Please set 'germinate.source.directory' in gradle.properties")
        }

        args = [host, port, database, user, password, project.property('germinate.source.directory')]
    }
}