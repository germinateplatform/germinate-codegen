buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
}

compileJava.options.encoding = 'UTF-8'

group = 'uk.ac.hutton.germinate'
version = '5.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation 'org.json:json:20250517'
    implementation 'com.google.code.gson:gson:2.10'

    implementation 'com.mysql:mysql-connector-j:8.2.0'
    implementation 'org.jooq:jooq:3.20.5'
    implementation 'org.jooq:jooq-codegen:3.20.5'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'javax.activation:activation:1.1.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.2'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

// Runs the JOOQ code generation
task codegen (type: JavaExec) {
    group = 'Execution'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.jooq.codegen.GenerationTool'
    args 'jooq.xml'
    finalizedBy build
}